<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TechSched 调度漏斗</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
</head>
<body style="margin:0">
<style>
  :root {
    color-scheme: light;
    --bg: #f1f3f6; --surface: #ffffff; --surface-2: #f7f8fa; --ink: #161a20; --ink-2: #59616f; --ink-3: #8a919e;
    --line: #dde1e8; --line-2: #eceff3;
    --accent: #2a78d6; --accent-soft: #e4eefb; --accent-ink: #1b5aa8;
    --blk: #cfd5df; --blk-ink: #2a303c; --blk-lock: #a6aebd; --blk-done: #e4e7ec;
    --p0: #d03b3b; --p1: #eb6834; --p2: #eda100; --p3: #7d8797;
    --good: #0ca30c; --good-soft: #e3f5e3; --warn: #fab219; --warn-ink: #8a5a00; --warn-soft: #fff3d6; --crit: #d03b3b; --crit-soft: #fbe3e3;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
    --unavail: #f7caca; --shift: #eef0f4;
    --shadow: 0 1px 2px rgba(20, 30, 50, .06), 0 6px 20px rgba(20, 30, 50, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #111316; --surface: #1a1d22; --surface-2: #21252c; --ink: #eef0f3; --ink-2: #a9b0bc; --ink-3: #7d8593;
      --line: #2c3139; --line-2: #262a31;
      --accent: #3987e5; --accent-soft: #1b2a41; --accent-ink: #8fbcf3;
      --blk: #3d4453; --blk-ink: #e3e7ee; --blk-lock: #566072; --blk-done: #2a2f38;
      --p3: #6d7787;
      --good-soft: #17301a; --warn-ink: #f5c453; --warn-soft: #3a2d0f; --crit-soft: #3d1c1c;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
      --unavail: #4a2424; --shift: #22262d;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111316; --surface: #1a1d22; --surface-2: #21252c; --ink: #eef0f3; --ink-2: #a9b0bc; --ink-3: #7d8593;
    --line: #2c3139; --line-2: #262a31;
    --accent: #3987e5; --accent-soft: #1b2a41; --accent-ink: #8fbcf3;
    --blk: #3d4453; --blk-ink: #e3e7ee; --blk-lock: #566072; --blk-done: #2a2f38;
    --p3: #6d7787;
    --good-soft: #17301a; --warn-ink: #f5c453; --warn-soft: #3a2d0f; --crit-soft: #3d1c1c;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --unavail: #4a2424; --shift: #22262d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Sans', 'Noto Sans SC', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    font-size: 13px; line-height: 1.45;
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  .num { font-family: 'Manrope', 'IBM Plex Sans', sans-serif; font-variant-numeric: tabular-nums; }

  .app { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-inline: 16px; padding-block: 10px; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { margin: 0; font: 800 18px/1.1 'Manrope', 'Noto Sans SC', sans-serif; letter-spacing: -.01em; }
  .brand .sub { color: var(--ink-3); font: 500 11px/1 'IBM Plex Mono', monospace; letter-spacing: .02em; }
  .tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .tabs button { border: 0; background: transparent; color: var(--ink-2); font: 500 12px/1 'IBM Plex Sans', 'Noto Sans SC', sans-serif; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); }
  .tabs button:focus-visible, .ctl button:focus-visible, .step:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ctl { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .ctl button, .ctl select, .ctl label { height: 30px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 0 10px; font: 500 12px/1 'IBM Plex Sans', 'Noto Sans SC', sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .ctl button.primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 74px; justify-content: center; }
  .ctl button:disabled { opacity: .4; cursor: default; }
  .ctl kbd { font: 500 10px/1 'IBM Plex Mono', monospace; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
  .hidden-ctl header .ctl, .hidden-ctl .steps { display: none; }

  /* ---------- main ---------- */
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 392px; gap: 12px; }
  .stage { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 0; display: flex; flex-direction: column; box-shadow: var(--shadow); }
  .stage-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .pills { display: flex; gap: 4px; }
  .pill { font-size: 11px; letter-spacing: .04em; color: var(--ink-3); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; background: var(--surface-2); display: inline-flex; gap: 6px; align-items: center; }
  .pill i { font-style: normal; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 10px; color: var(--ink-3); }
  .pill.on { color: var(--accent-ink); border-color: var(--accent); background: var(--accent-soft); }
  .pill.on i { color: var(--accent-ink); }
  .pill.done { color: var(--ink-2); }
  .pill.done i { color: var(--good); }
  .pill.skip { text-decoration: line-through; opacity: .55; }
  .stage-top .ver { margin-left: auto; font-size: 11px; color: var(--ink-3); }
  .stage-top .ver b { color: var(--ink); font-family: 'Manrope', sans-serif; }
  .svgwrap { flex: 1; min-height: 0; overflow-x: auto; overflow-y: hidden; }
  svg#gantt { width: 100%; min-width: 720px; height: auto; max-height: 100%; display: block; }

  .panel { min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 2px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
  .card h3 { margin: 0 0 8px; font: 700 10.5px/1 'IBM Plex Sans', 'Noto Sans SC', sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; gap: 8px; }
  .card h3 .src { margin-left: auto; font: 400 10px/1 'IBM Plex Mono', monospace; letter-spacing: 0; text-transform: none; color: var(--ink-3); }

  /* narration */
  .narr { border-color: var(--accent); }
  .narr .k { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .narr .agent { font: 700 11px/1 'IBM Plex Mono', monospace; color: var(--accent-ink); background: var(--accent-soft); border-radius: 6px; padding: 4px 7px; }
  .narr .idx { font-size: 11px; color: var(--ink-3); }
  .narr h2 { margin: 8px 0 6px; font: 700 15px/1.3 'Manrope', 'Noto Sans SC', sans-serif; text-wrap: balance; }
  .narr ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .narr li { display: flex; gap: 8px; font-size: 12px; line-height: 1.45; }
  .narr li::before { content: '›'; color: var(--ink-3); flex: none; }
  .narr li code { font: 500 11.5px/1.45 'IBM Plex Mono', monospace; color: var(--ink); background: var(--surface-2); border-radius: 4px; padding: 0 4px; }
  .narr .prog { margin-top: 10px; height: 3px; background: var(--line-2); border-radius: 2px; overflow: hidden; }
  .narr .prog i { display: block; height: 100%; width: 0; background: var(--accent); }
  .narr .prog i.run { animation: prog linear forwards; }
  @keyframes prog { from { width: 0 } to { width: 100% } }

  /* funnel */
  .funnel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .tile { background: var(--surface-2); border-radius: 8px; padding: 8px 8px 7px; position: relative; }
  .tile .l { font-size: 10px; color: var(--ink-3); letter-spacing: .04em; }
  .tile .v { font: 800 22px/1.1 'Manrope', sans-serif; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .tile .v.dash { color: var(--ink-3); font-weight: 500; }
  .tile .v.bump { animation: bump .28s ease-out; }
  @keyframes bump { 0% { transform: scale(1.18); color: var(--accent) } 100% { transform: none } }
  .tile + .tile::before { content: '→'; position: absolute; left: -9px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-size: 11px; }
  .tile .v.auto { color: var(--good) } .tile .v.manual { color: var(--warn) } .tile .v.forbidden { color: var(--crit) }
  .rej { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; min-height: 22px; }
  .chip { font: 500 10.5px/1 'IBM Plex Mono', monospace; padding: 4px 7px; border-radius: 6px; background: var(--crit-soft); color: var(--crit); border: 1px solid transparent; }
  .chip.ok { background: var(--good-soft); color: var(--good); }
  .chip.auth { background: var(--warn-soft); color: var(--warn-ink); }
  .chip b { font-weight: 500; opacity: .75; }
  .rej .empty { font-size: 11px; color: var(--ink-3); }

  /* scores */
  .cands { display: flex; flex-direction: column; gap: 7px; }
  .cand { display: grid; grid-template-columns: 118px 1fr 40px; align-items: center; gap: 8px; }
  .cand .who { font-size: 11.5px; line-height: 1.25; }
  .cand .who small { display: block; color: var(--ink-3); font-size: 10px; font-family: 'IBM Plex Mono', monospace; }
  .cand .bar { position: relative; height: 16px; background: var(--surface-2); border-radius: 4px; display: flex; gap: 2px; overflow: visible; }
  .cand .bar span { display: block; height: 100%; transition: width .6s cubic-bezier(.2,.7,.2,1); }
  .cand .bar span:first-child { border-radius: 4px 0 0 4px; }
  .cand .bar span:last-child { border-radius: 0 4px 4px 0; }
  .cand .bar::after { content: ''; position: absolute; left: 70%; top: -4px; bottom: -4px; border-left: 2px dashed var(--ink-2); pointer-events: none; }
  .cand .tot { font: 700 14px/1 'Manrope', sans-serif; font-variant-numeric: tabular-nums; text-align: right; }
  .cand.low .tot { color: var(--ink-3); }
  .cand.chosen .who { font-weight: 600; }
  .cand.chosen .bar { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .cand.min .bar { outline: 2px solid var(--warn); outline-offset: 2px; border-radius: 4px; }
  .cand.min .tot { color: var(--warn-ink); }
  .s-1 { background: var(--s1) } .s-2 { background: var(--s2) } .s-3 { background: var(--s3) } .s-4 { background: var(--s4) } .s-5 { background: var(--s5) }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 8px; font-size: 10.5px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .legend .thr { margin-left: auto; color: var(--ink-2); }
  .dscore { margin-top: 8px; font: 500 11.5px/1.4 'IBM Plex Mono', monospace; color: var(--ink); background: var(--surface-2); border-radius: 6px; padding: 6px 8px; }
  .dscore.min { background: var(--warn-soft); }
  .scores .empty, .strat .empty { font-size: 11px; color: var(--ink-3); }

  /* strategies */
  .strats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; }
  .st { border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px; background: var(--surface-2); }
  .st.chosen { border-color: var(--accent); background: var(--accent-soft); }
  .st .tags { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 5px; }
  .st .tag { font: 500 9.5px/1 'IBM Plex Mono', monospace; color: var(--accent-ink); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; }
  .st .who { font-size: 12px; font-weight: 600; }
  .st .m { display: flex; gap: 8px; margin-top: 4px; font-size: 10.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .st .m b { color: var(--ink); font-family: 'Manrope', sans-serif; }
  .st .note { margin-top: 5px; font-size: 10.5px; color: var(--ink-3); }

  /* authority */
  .auth table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .auth th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 10px; letter-spacing: .04em; padding: 0 6px 4px; }
  .auth td { padding: 5px 6px; border-top: 1px solid var(--line-2); font-variant-numeric: tabular-nums; }
  .auth tr.on td { background: var(--accent-soft); }
  .auth tr.on td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  .auth td.p { font: 700 11px/1 'IBM Plex Mono', monospace; }
  .auth .P0 { color: var(--p0) } .auth .P1 { color: var(--p1) } .auth .P2 { color: var(--warn-ink) } .auth .P3 { color: var(--ink-2) }
  .gate { margin-top: 10px; border-radius: 10px; padding: 10px 12px; border: 1px solid var(--line); background: var(--surface-2); transition: background .4s, border-color .4s; }
  .gate .g { font: 800 15px/1 'Manrope', sans-serif; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
  .gate .g i { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-3); display: inline-block; }
  .gate.auto { background: var(--good-soft); border-color: var(--good); } .gate.auto .g { color: var(--good) } .gate.auto .g i { background: var(--good) }
  .gate.manual { background: var(--warn-soft); border-color: var(--warn); } .gate.manual .g { color: var(--warn-ink) } .gate.manual .g i { background: var(--warn) }
  .gate.forbidden { background: var(--crit-soft); border-color: var(--crit); } .gate.forbidden .g { color: var(--crit) } .gate.forbidden .g i { background: var(--crit) }
  .gate ul { margin: 6px 0 0; padding: 0; list-style: none; font: 400 11px/1.45 'IBM Plex Mono', monospace; color: var(--ink-2); }
  .gate li::before { content: '· '; }
  .gate .g.idle { color: var(--ink-3); font-weight: 600; font-size: 12px; }

  /* steps strip */
  .steps { display: flex; gap: 6px; overflow-x: auto; padding-block: 2px 4px; scrollbar-width: thin; }
  .step { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 8px; padding: 6px 9px; font: 500 11px/1.2 'IBM Plex Sans', 'Noto Sans SC', sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; max-width: 220px; text-align: left; }
  .step .n { font: 700 10px/1 'Manrope', sans-serif; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .step.done { color: var(--ink-3); } .step.done .n { background: var(--line); border-color: var(--line); color: var(--ink-2); }
  .step.now { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); } .step.now .n { background: var(--accent); border-color: var(--accent); color: #fff; }
  .step .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- svg ---------- */
  .row-lab { font: 600 11.5px 'IBM Plex Sans', sans-serif; fill: var(--ink); }
  .row-sk { font: 400 8.5px 'IBM Plex Mono', monospace; fill: var(--ink-3); }
  .rowg { transition: opacity .5s; }
  .rowg.dim { opacity: .22; }
  .rowg.hl .row-lab { fill: var(--accent-ink); }
  .axis { font: 500 9.5px 'IBM Plex Mono', monospace; fill: var(--ink-3); }
  .grid { stroke: var(--line-2); }
  .shiftband { fill: var(--shift); }
  .blk { transition: transform .85s cubic-bezier(.2,.7,.2,1), opacity .4s; }
  .blk rect { rx: 3; stroke-width: 1; transition: fill .4s, stroke .4s; }
  .blk text { font: 500 8.5px 'IBM Plex Mono', monospace; pointer-events: none; }
  .blk.p3 rect { fill: var(--blk); stroke: var(--blk); } .blk.p3 text { fill: var(--blk-ink); }
  .blk.p2 rect { fill: var(--p2); stroke: var(--p2); } .blk.p2 text { fill: #1a1a1a; }
  .blk.p1 rect { fill: var(--p1); stroke: var(--p1); } .blk.p1 text { fill: #fff; }
  .blk.p0 rect { fill: var(--p0); stroke: var(--p0); } .blk.p0 text { fill: #fff; }
  .blk.done rect { fill: var(--blk-done); stroke: var(--blk-done); } .blk.done text { fill: var(--ink-3); }
  .blk.locked rect { stroke: var(--blk-ink); stroke-width: 1.4; }
  .blk.locked .lock { fill: var(--blk-ink); }
  .blk.released rect { fill: transparent; stroke: var(--crit); stroke-dasharray: 4 3; stroke-width: 1.4; } .blk.released text { fill: var(--crit); }
  .blk.moved rect { fill: var(--accent); stroke: var(--accent); } .blk.moved text { fill: #fff; }
  .blk.pending rect { fill: var(--accent-soft); stroke: var(--accent); stroke-dasharray: 4 3; stroke-width: 1.4; } .blk.pending text { fill: var(--accent-ink); }
  .blk.committed rect { fill: var(--accent); stroke: var(--accent); } .blk.committed text { fill: #fff; }
  .blk.committed.p0 rect { fill: var(--p0); stroke: var(--p0); }
  .blk.ghost-ok rect { fill: var(--good-soft); stroke: var(--good); stroke-dasharray: 4 3; stroke-width: 1.4; } .blk.ghost-ok text { fill: var(--good); }
  .blk.ghost-auth rect { fill: transparent; stroke: var(--warn); stroke-dasharray: 2 3; stroke-width: 1.4; } .blk.ghost-auth text { fill: var(--warn-ink); }
  .blk.ghost-auth text.strike { text-decoration: line-through; }
  .blk.faint { opacity: .45; }
  .badge { font: 700 8px 'IBM Plex Mono', monospace; }
  .badge rect { rx: 7; }
  .badge.P0 rect { fill: var(--p0) } .badge.P2 rect { fill: var(--p2) } .badge text { fill: #fff } .badge.P2 text { fill: #1a1a1a }
  .trial rect { rx: 3; fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 5 3; }
  .trial.rej rect { fill: var(--crit-soft); stroke: var(--crit); animation: shake .32s ease-out; }
  .trial.ok rect { fill: var(--good-soft); stroke: var(--good); }
  .trial.auth rect { fill: var(--warn-soft); stroke: var(--warn); }
  .trial text { font: 600 8.5px 'IBM Plex Mono', monospace; fill: var(--accent-ink); }
  .trial.rej text { fill: var(--crit) } .trial.ok text { fill: var(--good) } .trial.auth text { fill: var(--warn-ink) }
  .trial .code { font-weight: 700; }
  @keyframes shake { 0% { transform: translateX(0) } 30% { transform: translateX(-2px) } 60% { transform: translateX(2px) } 100% { transform: translateX(0) } }
  .nowline { stroke: var(--crit); stroke-width: 1.2; stroke-dasharray: 3 3; }
  .nowlab { font: 700 9px 'IBM Plex Mono', monospace; fill: var(--crit); }
  .unav { fill: var(--unavail); }
  .tcard rect.bg { fill: var(--surface-2); stroke: var(--line); rx: 8; }
  .tcard.live rect.bg { stroke: var(--accent); stroke-width: 1.4; fill: var(--accent-soft); }
  .tcard .id { font: 700 11px 'IBM Plex Mono', monospace; fill: var(--ink); }
  .tcard .d { font: 400 9px 'IBM Plex Sans', 'Noto Sans SC', sans-serif; fill: var(--ink-2); }
  .tcard .pri { font: 700 9px 'IBM Plex Mono', monospace; fill: #fff; }
  .tcard .pri-bg { rx: 6; }
  .arc { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 5 4; opacity: 0; transition: opacity .4s; marker-end: url(#arrow); }
  .arc.show { opacity: 1; }
  .winlab { font: 500 8.5px 'IBM Plex Mono', monospace; fill: var(--good); }
  .winline { stroke: var(--good); stroke-width: 1.2; }
  .cap { font: 500 9px 'IBM Plex Sans', 'Noto Sans SC', sans-serif; fill: var(--ink-3); }
  .stagecap { font: 700 9.5px 'IBM Plex Mono', monospace; fill: var(--accent-ink); }

  @media (max-width: 980px) {
    .app { height: auto; }
    .main { grid-template-columns: 1fr; }
    .panel { overflow: visible; }
    .funnel { grid-template-columns: repeat(2, 1fr); }
    .tile + .tile::before { display: none; }
    .cand { grid-template-columns: 96px 1fr 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blk, .cand .bar span, .gate, .rowg, .arc { transition: none; }

    const startScene = { ...target.scene, ghosts: live.scene.ghosts.slice() };
    const startPanel = { ...target.panel, funnel: { ...(live.panel.funnel || {}) }, rejections: live.panel.rejections ? { ...live.panel.rejections } : null };
    const baseExplored = startPanel.funnel.explored || 0, baseFeasible = startPanel.funnel.feasible || 0;
    let explored = baseExplored, feasible = baseFeasible; const rej = { ...(startPanel.rejections || {}) };
    render(startScene, startPanel);
    const trials = step.scan; let k = 0;
    const tick = () => {
      if (seq !== runSeq) return;
      if (k >= trials.length) { scanTimers.push(setTimeout(() => { if (seq === runSeq) render(target.scene, target.panel); }, 500)); return; }
      const t = trials[k]; explored++;
      if (t.v === 'ok') feasible++; else rej[t.code] = (rej[t.code] || 0) + 1;
      L.trial.innerHTML = ''; L.trial.setAttribute('class', 'trial ' + t.v);
      const y = rowY(techIdx[t.tech]) + 10, w = Math.max(6, X(t.e) - X(t.s));
      el('rect', { x: X(t.s), y, width: w, height: BH }, L.trial);
      txt(L.trial, X(t.s) + 3, y - 4, t.v === 'ok' ? `✓ ${F(t.s)}${t.note ? ' · ' + t.note : ''}` : t.v === 'auth' ? `✗ ${t.code} · ${t.note || ''}` : `✗ ${t.code}${t.note ? ' · ' + t.note : ''}`, 'code');
      txt(L.trial, X(t.s) + 3, y + 15, `#${explored} ${F(t.s)}–${F(t.e)}`, '');
      if (t.v !== 'rej') startScene.ghosts.push({ ...t, id: 'g_' + t.tech + '_' + k });
      startPanel.funnel = { ...startPanel.funnel, explored, feasible }; startPanel.rejections = { ...rej };
      render(startScene, startPanel, { keepTrial: true });
      $('funnel').querySelectorAll('.v').forEach(e => e.classList.add('bump'));
      k++;
      scanTimers.push(setTimeout(tick, scanDelay(k)));
    };
    tick();
  }

  // ------------------------------------------------------------------ step machine
  function clearTimers() { if (timer) clearTimeout(timer); timer = null; scanTimers.forEach(clearTimeout); scanTimers = []; }
  function show(i, fromNav) {
    clearTimers(); runSeq++;
    idx = Math.max(0, Math.min(sc.steps.length - 1, i));
    const st = sc.steps[idx];
    if (st.scan && !fromNav) runScan(st, runSeq); else { const { scene, panel } = stateAt(idx); render(scene, panel); }
    renderNarr(st, playing); renderSteps();
    $('btnPrev').disabled = idx === 0; $('btnNext').disabled = idx === sc.steps.length - 1;
    if (playing) schedule();
  }
  function schedule() {
    clearTimeout(timer);
    const st = sc.steps[idx];
    timer = setTimeout(() => {
      if (idx < sc.steps.length - 1) show(idx + 1);
      else if (loop) show(0);
      else { playing = false; $('btnPlay').textContent = '▶ 播放'; renderNarr(st, false); }
    }, stepDuration(st));
  }
  function setPlaying(p) { playing = p; $('btnPlay').textContent = p ? '⏸ 暂停' : '▶ 播放'; if (p) { renderNarr(sc.steps[idx], true); schedule(); } else { clearTimeout(timer); timer = null; renderNarr(sc.steps[idx], false); } }
  function selectScenario(id) { sc = SCENARIOS.find(s => s.id === id) || SCENARIOS[0]; renderTabs(); buildStatic(); playing = true; $('btnPlay').textContent = '⏸ 暂停'; show(0); }

  // ------------------------------------------------------------------ wiring
  $('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) selectScenario(b.dataset.s); });
  $('steps').addEventListener('click', e => { const b = e.target.closest('.step'); if (b) show(Number(b.dataset.i)); });
  $('btnPrev').addEventListener('click', () => show(idx - 1, true));
  $('btnNext').addEventListener('click', () => show(idx + 1));
  $('btnPlay').addEventListener('click', () => setPlaying(!playing));
  $('btnRestart').addEventListener('click', () => { playing = true; $('btnPlay').textContent = '⏸ 暂停'; show(0); });
  $('speed').addEventListener('change', e => { speed = Number(e.target.value); if (playing) { renderNarr(sc.steps[idx], true); schedule(); } });
  $('loop').addEventListener('change', e => { loop = e.target.checked; });
  $('btnHide').addEventListener('click', () => $('app').classList.toggle('hidden-ctl'));
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, select, textarea')) return;
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    else if (e.key === 'ArrowRight') show(idx + 1);
    else if (e.key === 'ArrowLeft') show(idx - 1, true);
    else if (e.key === 'r' || e.key === 'R') { playing = true; $('btnPlay').textContent = '⏸ 暂停'; show(0); }
    else if (e.key === 'h' || e.key === 'H') $('app').classList.toggle('hidden-ctl');
  });
  try { const p = new URLSearchParams(location.search); if (p.get('present') === '1') $('app').classList.add('hidden-ctl'); const s = p.get('scenario'); if (s && SCENARIOS.some(x => x.id === s)) sc = SCENARIOS.find(x => x.id === s); } catch (e) { /* no-op */ }

  renderTabs(); buildStatic(); show(0);
})();
</script>
</body>
</html>
